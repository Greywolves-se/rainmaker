# G1 on a developer's machine or in the local Docker stack: --spring.profiles.active=local, or
# SPRING_PROFILES_ACTIVE=local (#153, review of #189). Never in AWS.
#
# The click links point at this G1 on localhost, and without RAINMAKER_CLICK_SIGNING_KEY they are
# signed with a random key for each run (a WARN says so): links served before a restart stop
# working, which is fine locally. With several G1s, or after a deploy, that would lose clicks, so
# only this profile allows it.
rainmaker.tracking-click.link.base-url=${RAINMAKER_CLICK_BASE_URL:http://localhost:${server.port}}
rainmaker.tracking-click.link.allow-random-signing-key=true
