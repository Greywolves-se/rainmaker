# G1 Reader & clicks (#155). Ports for the demo stack: G1 8081, G2 8082, G3 8083; the test site 3000.
spring.application.name=g1-reader-app
server.port=8081

# Each module's own database (#155, architecture D16), on the local PostgreSQL from
# docker-compose.yml. The password is for a developer's machine only; in AWS it comes from
# Secrets Manager, and the same value is in docker/postgres/init. RAINMAKER_DB_HOST lets the apps reach PostgreSQL inside Docker (#146).
rainmaker.tracking-click.datasource.jdbc-url=jdbc:postgresql://${RAINMAKER_DB_HOST:localhost}:5432/tracking_click
rainmaker.tracking-click.datasource.username=tracking_click
rainmaker.tracking-click.datasource.password=local-dev-only
rainmaker.tracking-click.datasource.maximum-pool-size=3

# S2 click links (#153, contract 7.5): G1 as the reader's browser reaches it, how long a link works,
# and the HMAC signing key. The key only ever comes from the environment, never from this file;
# without it (a developer's machine) G1 signs with a random key for each run and logs a WARN.
rainmaker.tracking-click.link.base-url=http://localhost:${server.port}
rainmaker.tracking-click.link.lifetime=24h
rainmaker.tracking-click.link.signing-key=${RAINMAKER_CLICK_SIGNING_KEY:}
