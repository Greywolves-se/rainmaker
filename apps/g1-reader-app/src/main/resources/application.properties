# G1 Reader & clicks (#155). Ports for the demo stack: G1 8081, G2 8082, G3 8083; the test site 3000.
spring.application.name=g1-reader-app
server.port=8081

# Each module's own database (#155, architecture D16), on the local PostgreSQL from
# docker-compose.yml. The password is for a developer's machine only; in AWS it comes from
# Secrets Manager, and the same value is in docker/postgres/init. RAINMAKER_DB_HOST lets the apps reach PostgreSQL inside Docker (#146).
rainmaker.tracking-click.datasource.jdbc-url=jdbc:postgresql://${RAINMAKER_DB_HOST:localhost}:5432/tracking_click
rainmaker.tracking-click.datasource.username=tracking_click
rainmaker.tracking-click.datasource.password=local-dev-only
rainmaker.tracking-click.datasource.maximum-pool-size=3

# rainmaker.js, served at /widget/rainmaker.js (#152, contract D-7). Build it first with
# npm run build in widget/; the path is relative to the folder G1 is started from (the repository
# root). Another location: --rainmaker.widget-delivery.script-location=file:/path/rainmaker.js
rainmaker.widget-delivery.script-location=file:widget/dist/rainmaker.js

# S1 asks G3 for an article's approved links on every hover (#151, contract 7.3). rainmaker.js waits
# at most 2 s for the panel, so G1 gives G3 at most 2 x (250 ms + 500 ms) + 50 ms = 1.55 s. While G3
# keeps failing, the circuit breaker stops calling it for open-for and hovers get no links at once.
# RAINMAKER_G3_URL points it elsewhere, e.g. inside Docker (#146).
rainmaker.widget-delivery.approved-links.base-url=${RAINMAKER_G3_URL:http://localhost:8083}
rainmaker.widget-delivery.approved-links.connect-timeout=250ms
rainmaker.widget-delivery.approved-links.read-timeout=500ms
rainmaker.widget-delivery.approved-links.max-attempts=2
rainmaker.widget-delivery.approved-links.backoff=50ms
rainmaker.widget-delivery.approved-links.circuit-breaker.window-size=10
rainmaker.widget-delivery.approved-links.circuit-breaker.minimum-calls=5
rainmaker.widget-delivery.approved-links.circuit-breaker.failure-rate-percent=50
rainmaker.widget-delivery.approved-links.circuit-breaker.open-for=10s

# The widget API, /widget/v1/links (#151, contract 7.4): the publisher sites whose pages may call it
# from the browser (CORS), comma-separated origins. For the demo, the fake-news site.
rainmaker.widget-delivery.widget-api.allowed-origins=http://localhost:3000

# S2 click links (#153, contract 7.5): G1 as the reader's browser reaches it, how long a link works,
# and the HMAC signing key. The key only ever comes from the environment, never from this file.
# Without the address or the key G1 doesn't start, because its links would lose clicks; on a
# developer's machine, the local profile sets both (application-local.properties).
rainmaker.tracking-click.link.base-url=${RAINMAKER_CLICK_BASE_URL:}
rainmaker.tracking-click.link.lifetime=24h
rainmaker.tracking-click.link.signing-key=${RAINMAKER_CLICK_SIGNING_KEY:}
