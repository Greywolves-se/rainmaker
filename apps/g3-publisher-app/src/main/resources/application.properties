# G3 Publisher & marketplace (#155). Ports for the demo stack: G1 8081, G2 8082, G3 8083; the test site 3000.
spring.application.name=g3-publisher-app
server.port=8083

# Each module's own database (#155, architecture D16), on the local PostgreSQL from
# docker-compose.yml. The password is for a developer's machine only; in AWS it comes from
# Secrets Manager, and the same value is in docker/postgres/init. RAINMAKER_DB_HOST lets the apps reach PostgreSQL inside Docker (#146).
rainmaker.publisher-control.datasource.jdbc-url=jdbc:postgresql://${RAINMAKER_DB_HOST:localhost}:5432/publisher_control
rainmaker.publisher-control.datasource.username=publisher_control
rainmaker.publisher-control.datasource.password=local-dev-only
rainmaker.publisher-control.datasource.maximum-pool-size=3
rainmaker.advertiser-marketplace.datasource.jdbc-url=jdbc:postgresql://${RAINMAKER_DB_HOST:localhost}:5432/advertiser_marketplace
rainmaker.advertiser-marketplace.datasource.username=advertiser_marketplace
rainmaker.advertiser-marketplace.datasource.password=local-dev-only
rainmaker.advertiser-marketplace.datasource.maximum-pool-size=3

# Where S4's landing pages are served: this app (#149). An offer's destination URL is this
# address plus /landing/<offer id>.
rainmaker.advertiser-marketplace.landing-base-url=http://localhost:${server.port}

# S3 copies G2's articles and suggestions for the editor (#150, contract 7.1): every few seconds it
# asks G2 for a snapshot of the most recent articles, with timeouts and retries. In Docker (#146),
# set RAINMAKER_G2_URL to http://test-site:8082: G2 shares the test site's network there.
rainmaker.publisher-control.articles.base-url=${RAINMAKER_G2_URL:http://localhost:8082}
rainmaker.publisher-control.articles.connect-timeout=2s
rainmaker.publisher-control.articles.read-timeout=5s
rainmaker.publisher-control.articles.max-attempts=3
rainmaker.publisher-control.articles.backoff=500ms
rainmaker.publisher-control.articles.poll-interval=5s
rainmaker.publisher-control.articles.recent=100
