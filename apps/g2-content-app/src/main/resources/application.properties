# G2 Content & intelligence (#155). Ports for the demo stack: G1 8081, G2 8082, G3 8083; the test site 3000.
spring.application.name=g2-content-app
server.port=8082

# Each module's own database (#155, architecture D16), on the local PostgreSQL from
# docker-compose.yml. The password is for a developer's machine only; in AWS it comes from
# Secrets Manager, and the same value is in docker/postgres/init. RAINMAKER_DB_HOST lets the apps reach PostgreSQL inside Docker (#146).
rainmaker.content-ingestion.datasource.jdbc-url=jdbc:postgresql://${RAINMAKER_DB_HOST:localhost}:5432/content_ingestion
rainmaker.content-ingestion.datasource.username=content_ingestion
rainmaker.content-ingestion.datasource.password=local-dev-only
rainmaker.content-ingestion.datasource.maximum-pool-size=3
# S5 reads the test site's RSS feed (#147). RAINMAKER_FEED_URL points it elsewhere, e.g. inside Docker (#146).
rainmaker.content-ingestion.feed.url=${RAINMAKER_FEED_URL:http://localhost:3000/rss.xml}
# Every minute for the demo; the end-to-end test (#154) shortens it with RAINMAKER_FEED_POLL_INTERVAL.
rainmaker.content-ingestion.feed.poll-interval=${RAINMAKER_FEED_POLL_INTERVAL:1m}
rainmaker.content-ingestion.feed.timeout=5s
rainmaker.content-intent.datasource.jdbc-url=jdbc:postgresql://${RAINMAKER_DB_HOST:localhost}:5432/content_intent
rainmaker.content-intent.datasource.username=content_intent
rainmaker.content-intent.datasource.password=local-dev-only
rainmaker.content-intent.datasource.maximum-pool-size=3
rainmaker.matching-ranking.datasource.jdbc-url=jdbc:postgresql://${RAINMAKER_DB_HOST:localhost}:5432/matching_ranking
rainmaker.matching-ranking.datasource.username=matching_ranking
rainmaker.matching-ranking.datasource.password=local-dev-only
rainmaker.matching-ranking.datasource.maximum-pool-size=3

# S6 classifier (#148). mode: fake (default; no AWS needed) or bedrock (Claude on Amazon Bedrock,
# credentials from the environment: AWS_PROFILE locally, the task role in AWS). The model is the
# EU inference profile allowed by the G2 role (#161); switch it with RAINMAKER_CLASSIFIER_MODEL_ID.
# The limits stop a runaway loop long before AWS's cost data (a few hours late) would.
rainmaker.content-intent.classifier.mode=${RAINMAKER_CLASSIFIER_MODE:fake}
rainmaker.content-intent.classifier.region=eu-north-1
rainmaker.content-intent.classifier.model-id=${RAINMAKER_CLASSIFIER_MODEL_ID:eu.anthropic.claude-haiku-4-5-20251001-v1:0}
rainmaker.content-intent.classifier.max-tokens=400
# Longer article texts are cut before sending (about 5,000 tokens), so one call can't use a large
# share of the daily cap. The test site's articles are under 2,000 characters.
rainmaker.content-intent.classifier.max-text-chars=20000
rainmaker.content-intent.classifier.timeout=20s
rainmaker.content-intent.classifier.max-attempts=3
rainmaker.content-intent.classifier.backoff=1s
rainmaker.content-intent.classifier.calls-per-minute=20
rainmaker.content-intent.classifier.daily-token-cap=200000
# Circuit breaker (#185): when at least half of the last 10 articles (5 at the least) still failed
# after their retries, no Bedrock call is made for a minute; those articles stay unclassified.
rainmaker.content-intent.classifier.circuit-breaker.failure-rate-percent=50
rainmaker.content-intent.classifier.circuit-breaker.window-size=10
rainmaker.content-intent.classifier.circuit-breaker.minimum-calls=5
rainmaker.content-intent.classifier.circuit-breaker.open-for=1m
# The fake classifier fails closed: every article is red, so no article ever gets suggestions or a
# panel without Claude (product rule; #173 review). For local work on matching or the widget, opt in
# with RAINMAKER_FAKE_ZONE=green; then every article is green, red ones included.
rainmaker.content-intent.classifier.fake.zone=${RAINMAKER_FAKE_ZONE:red}
# Only for the end-to-end test (#154), which needs a green and a red article in one run: a headline
# containing RAINMAKER_FAKE_GREEN_MARKER is green. Empty (the default): no headline is.
rainmaker.content-intent.classifier.fake.green-marker=${RAINMAKER_FAKE_GREEN_MARKER:}
# For a local demo without Claude (#261): known answers for the test site's articles, e.g.
# RAINMAKER_FAKE_CLASSIFICATIONS=classpath:content-intent/demo-classifications.json (green, yellow and red, each
# with its own topics). Unlisted headlines keep the answer above. Empty (the default): none.
rainmaker.content-intent.classifier.fake.classifications=${RAINMAKER_FAKE_CLASSIFICATIONS:}
rainmaker.content-intent.classifier.fake.topics=home
rainmaker.content-intent.classifier.fake.reason-sv=Låtsasklassificering för lokalt arbete, inte Claude.
rainmaker.content-intent.classifier.fake.reason-en=Fake classification for local work, not Claude.
# Failed and unclassified versions are classified again (#223): every 5 minutes, at most 10 per
# run, through the same classifier and its limits above.
rainmaker.content-intent.retry.interval=5m
rainmaker.content-intent.retry.batch-size=10

# S7 matching reads the offers from G3's API (#149, contract 7.2), with timeouts and retries.
# In Docker (#146), set RAINMAKER_G3_URL to G3's address inside the network.
rainmaker.matching-ranking.offers.base-url=${RAINMAKER_G3_URL:http://localhost:8083}
rainmaker.matching-ranking.offers.connect-timeout=2s
rainmaker.matching-ranking.offers.read-timeout=5s
rainmaker.matching-ranking.offers.max-attempts=3
rainmaker.matching-ranking.offers.backoff=500ms
# Green articles matched while G3 was down are matched again once it answers (#248): every 5
# minutes, at most 50 per run, with one call to G3 per run.
rainmaker.matching-ranking.retry.interval=5m
rainmaker.matching-ranking.retry.batch-size=50
