# G2 Content & intelligence (#155). Ports for the demo stack: G1 8081, G2 8082, G3 8083; the test site 3000.
spring.application.name=g2-content-app
server.port=8082

# Each module's own database (#155, architecture D16), on the local PostgreSQL from
# docker-compose.yml. The password is for a developer's machine only; in AWS it comes from
# Secrets Manager, and the same value is in docker/postgres/init. RAINMAKER_DB_HOST lets the apps reach PostgreSQL inside Docker (#146).
rainmaker.content-ingestion.datasource.jdbc-url=jdbc:postgresql://${RAINMAKER_DB_HOST:localhost}:5432/content_ingestion
rainmaker.content-ingestion.datasource.username=content_ingestion
rainmaker.content-ingestion.datasource.password=local-dev-only
rainmaker.content-ingestion.datasource.maximum-pool-size=3
# S5 reads the test site's RSS feed (#147). RAINMAKER_FEED_URL points it elsewhere, e.g. inside Docker (#146).
rainmaker.content-ingestion.feed.url=${RAINMAKER_FEED_URL:http://localhost:3000/rss.xml}
rainmaker.content-ingestion.feed.poll-interval=1m
rainmaker.content-ingestion.feed.timeout=5s
rainmaker.content-intent.datasource.jdbc-url=jdbc:postgresql://${RAINMAKER_DB_HOST:localhost}:5432/content_intent
rainmaker.content-intent.datasource.username=content_intent
rainmaker.content-intent.datasource.password=local-dev-only
rainmaker.content-intent.datasource.maximum-pool-size=3
rainmaker.matching-ranking.datasource.jdbc-url=jdbc:postgresql://${RAINMAKER_DB_HOST:localhost}:5432/matching_ranking
rainmaker.matching-ranking.datasource.username=matching_ranking
rainmaker.matching-ranking.datasource.password=local-dev-only
rainmaker.matching-ranking.datasource.maximum-pool-size=3
