server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Security headers (#47) are repeated in every location: nginx drops server-level
    # add_header lines in any location that has its own add_header.

    # Snapshot written by the collector into the shared volume (see docker-compose.yml).
    # The web app loads it from /snapshot.json (#18).
    location = /snapshot.json {
        alias /srv/snapshot/snapshot.json;
        add_header Cache-Control "no-store";
        add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # START HERE report, written next to the snapshot by the collector (#25), shown at
    # /start-here (#26). Plain Markdown; the web app renders it without raw HTML.
    location = /start-here.md {
        alias /srv/snapshot/start-here.md;
        default_type "text/markdown; charset=utf-8";
        add_header Cache-Control "no-store";
        add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Vite puts content-hashed files in /assets/, so they can be cached for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Client-side routing (react-router): unknown paths return index.html.
    location / {
        add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ /index.html;
    }
}
