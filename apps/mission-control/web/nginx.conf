server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Snapshot written by the collector into the shared volume (see docker-compose.yml).
    # The web app loads it from /snapshot.json (#18).
    location = /snapshot.json {
        alias /srv/snapshot/snapshot.json;
        add_header Cache-Control "no-store";
    }

    # Vite puts content-hashed files in /assets/, so they can be cached for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routing (react-router): unknown paths return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
