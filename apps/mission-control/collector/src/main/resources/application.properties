spring.application.name=mission-control-collector

# A command-line run: no web server, and only the collector's own log lines.
spring.main.web-application-type=none
spring.main.banner-mode=off
spring.main.log-startup-info=false

# Structured JSON logs (CLAUDE.md, "Logging and monitoring").
logging.structured.format.console=ecs

# Collector run (#11). Relative paths start at the working directory: the repository root
# locally, /workspace in the Docker image (same layout).
mission-control.collector.output-folder=apps/mission-control/out
# One snapshot per project (#99), in <output-folder>/<id>/. GitHub issues and pull requests belong
# to a project by label: with-label=x keeps only items labelled x, without-label=x leaves them out.
mission-control.collector.projects[0].id=rainmaker
mission-control.collector.projects[0].name=Rainmaker
mission-control.collector.projects[0].without-label=mission-control
mission-control.collector.projects[1].id=mission-control
mission-control.collector.projects[1].name=Mission Control
mission-control.collector.projects[1].with-label=mission-control
# Switch a source off with mission-control.collector.sources.<id>.enabled=false

# Data-file source (#15): hand-maintained YAML files, linked to their line on GitHub.
# Links point to the commit that was read when GITHUB_SHA is set (GitHub Actions), else develop.
mission-control.collector.data-files.folder=apps/mission-control/data
mission-control.collector.data-files.files-url=https://github.com/Greywolves-se/rainmaker/blob/${GITHUB_SHA:develop}/apps/mission-control/data

# GitHub (#12). The token is read from MC_GITHUB_TOKEN, else GITHUB_TOKEN; it is never logged.
# Locally: a fine-grained, read-only token limited to the repositories below.
mission-control.collector.github.api-url=https://api.github.com
mission-control.collector.github.token=${MC_GITHUB_TOKEN:${GITHUB_TOKEN:}}
mission-control.collector.github.repositories=Greywolves-se/rainmaker
mission-control.collector.github.connect-timeout=5s
mission-control.collector.github.read-timeout=30s
mission-control.collector.github.max-attempts=3
mission-control.collector.github.backoff=1s
mission-control.collector.github.rate-limit-max-wait=60s
mission-control.collector.github.max-pages=50

# Google Drive (#113): metadata of the newest files in each project's folder, never content.
# Login (#120): Google's standard login, no key. In CI, Workload Identity Federation
# (google-github-actions/auth, #112); locally, gcloud auth application-default login with the
# service account impersonated. Share each folder with the service account as Viewer. A project
# without a folder here shows the Drive source as disabled.
mission-control.collector.google-drive.api-url=https://www.googleapis.com/drive/v3
# Rainmaker's "Project files" folder, shared with the read-only service account (#112). If
# the Drive source shows an error on staging, comment this line out again while it is fixed.
mission-control.collector.google-drive.folders.rainmaker=1zh8BBu_31YV7W2a0N_CELxMNXDOf0vBG
mission-control.collector.google-drive.connect-timeout=5s
mission-control.collector.google-drive.read-timeout=30s
mission-control.collector.google-drive.max-attempts=3
mission-control.collector.google-drive.backoff=1s

# Navigator AI text (#115, ADR 0002): per page and project, one OpenAI call for both Swedish and
# English, with every person's name hidden before it leaves. Through Peter's OpenAI account; the
# key is read from OPENAI_API_KEY (AWS Secrets Manager in CI, #112) and never logged. The model is
# a setting: change it here, no code change needed. Off until MC_NAVIGATOR_ENABLED=true is set
# (in docker.yml, once Peter's API key is in Secrets Manager).
mission-control.collector.navigator.enabled=${MC_NAVIGATOR_ENABLED:false}
mission-control.collector.navigator.api-url=https://api.openai.com/v1
mission-control.collector.navigator.api-key=${OPENAI_API_KEY:}
mission-control.collector.navigator.model=gpt-6-luna
mission-control.collector.navigator.max-output-tokens=1200
mission-control.collector.navigator.connect-timeout=5s
mission-control.collector.navigator.read-timeout=60s
mission-control.collector.navigator.max-attempts=2
mission-control.collector.navigator.backoff=2s
