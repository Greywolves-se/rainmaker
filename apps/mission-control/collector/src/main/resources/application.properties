spring.application.name=mission-control-collector

# A command-line run: no web server, and only the collector's own log lines.
spring.main.web-application-type=none
spring.main.banner-mode=off
spring.main.log-startup-info=false

# Structured JSON logs (CLAUDE.md, "Logging and monitoring").
logging.structured.format.console=ecs

# Collector run (#11). Relative paths start at the working directory: the repository root
# locally, /workspace in the Docker image (same layout).
mission-control.collector.project-name=Rainmaker
mission-control.collector.output=apps/mission-control/out/snapshot.json
# Switch a source off with mission-control.collector.sources.<id>.enabled=false

# Data-file source (#15): hand-maintained YAML files, linked to their line on GitHub.
# Links point to the commit that was read when GITHUB_SHA is set (GitHub Actions), else develop.
mission-control.collector.data-files.folder=apps/mission-control/data
mission-control.collector.data-files.files-url=https://github.com/Greywolves-se/rainmaker/blob/${GITHUB_SHA:develop}/apps/mission-control/data

# GitHub (#12). The token is read from MC_GITHUB_TOKEN, else GITHUB_TOKEN; it is never logged.
# Locally: a fine-grained, read-only token limited to the repositories below.
mission-control.collector.github.api-url=https://api.github.com
mission-control.collector.github.token=${MC_GITHUB_TOKEN:${GITHUB_TOKEN:}}
mission-control.collector.github.repositories=Greywolves-se/rainmaker
mission-control.collector.github.connect-timeout=5s
mission-control.collector.github.read-timeout=30s
mission-control.collector.github.max-attempts=3
mission-control.collector.github.backoff=1s
mission-control.collector.github.rate-limit-max-wait=60s
mission-control.collector.github.max-pages=50
