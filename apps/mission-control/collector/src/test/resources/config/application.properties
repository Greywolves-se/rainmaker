# Test-only settings, added on top of src/main/resources/application.properties.
# They live in config/ on purpose: Spring Boot reads classpath:/config/application.properties in
# addition to classpath:/application.properties (with higher priority). A test file next to the
# main one would replace it instead.

# Tests never call the real GitHub or Google APIs (CLAUDE.md, "Testing"), even when a key is set, e.g.
# in CI. Tests of those sources build them themselves against WireMock.
mission-control.collector.sources.github.enabled=false
mission-control.collector.sources.github-pull-requests.enabled=false
mission-control.collector.sources.google-drive.enabled=false
mission-control.collector.navigator.enabled=false
mission-control.collector.navigator.api-key=
mission-control.collector.github.token=
