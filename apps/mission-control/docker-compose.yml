# Runs Mission Control V1 locally: the collector writes the snapshot once,
# then the web app serves the dashboard with that snapshot.
#
#   cp .env.example .env          # fill in MC_GITHUB_TOKEN
#   docker compose up --build     # dashboard on http://localhost:8080
#
# Refresh the snapshot without rebuilding or restarting the web app:
#   docker compose run --rm collector

name: mission-control

services:
  collector:
    build:
      context: ../..
      dockerfile: apps/mission-control/collector/Dockerfile
    # Skips the library's search for a Google Cloud metadata server when there is no Google login
    # (#120); without it, a run without a login first waits for that search to time out.
    environment:
      NO_GCE_CHECK: "true"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/workspace/apps/mission-control/data:ro
      - snapshot:/workspace/apps/mission-control/out

  web:
    build:
      context: ../..
      dockerfile: apps/mission-control/web/Dockerfile
    ports:
      - "${MC_WEB_PORT:-8080}:8080"
    volumes:
      - snapshot:/srv/snapshot:ro
    depends_on:
      collector:
        condition: service_completed_successfully

volumes:
  snapshot:
