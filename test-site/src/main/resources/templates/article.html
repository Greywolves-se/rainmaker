<!DOCTYPE html>
<!--/*
  One article. Data from PageController#article:
    article, sectionName, showKicker, related, panoramaAd, skyscraperAd
    body  the text with the in-article ad and (for PLUS) the paywall - see ArticleBodyBuilder

  Markup notes for Rainmaker:
  - Content Ingestion (S5) reads the article with selectors like "article h1" and "article p",
    so only the article itself is inside <article>. The kicker, byline, ad slot and paywall
    offer contain no <p>, so they never end up in the body text. Menus and "Läs också" are
    outside <article>.
  - Places for Rainmaker's next step (#217, ADR 0005): data-rainmaker-next-step="sidebar" beside
    the article and "after-article" after it, both empty until the widget fills one, and
    data-rainmaker-article-end, last in the article body. See README.md.
  - data-rainmaker-headline marks the headline; today's widget opens its panel when the reader
    hovers it (#152), until #220 replaces the hover.
  - The expected brand-safety zone is NOT in the HTML, so the AI classifier cannot "cheat".
  - PLUS articles keep their full text in the HTML; CSS fades out the locked part.
*/-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::content})}">
<body>
<th:block th:fragment="content">
  <th:block th:replace="~{fragments :: adSlot(${panoramaAd})}"></th:block>

  <div class="article-layout">
    <article class="article" th:data-article-id="${article.id()}">
      <header class="article__header">
        <div class="article__labels">
          <a class="article__section" th:href="@{/sektion/{id}(id=${article.section().id()})}" th:text="${sectionName}"></a>
          <th:block th:if="${article.premium()}"><th:block th:replace="~{fragments :: plusBadge}"></th:block></th:block>
          <span th:if="${showKicker}" class="kicker" th:text="${article.kicker()}"></span>
        </div>
        <h1 class="article__headline" data-rainmaker-headline th:text="${article.headline()}"></h1>
        <p class="article__lead" th:text="${article.lead()}"></p>
        <div class="byline">
          <span class="byline__avatar" aria-hidden="true" th:text="${@view.initials(article.author().name())}"></span>
          <div class="byline__text">
            <span class="byline__name" th:text="${article.author().name()}"></span>
            <span class="byline__role" th:text="${article.author().role()}"></span>
          </div>
          <div class="byline__meta">
            <th:block th:replace="~{fragments :: publishTimes(${article})}"></th:block>
            <span class="reading-time" th:text="#{article.readingTime(${@view.readingTimeMinutes(article)})}"></span>
          </div>
        </div>
      </header>

      <figure class="article__figure">
        <th:block th:replace="~{fragments :: illustration(${article.section()})}"></th:block>
        <figcaption class="article__caption" th:text="#{article.illustrationCredit}"></figcaption>
      </figure>

      <div class="article__body" th:data-paywall-state="${body.paywalled()} ? 'locked'">
        <th:block th:each="item : ${body.free()}">
          <th:block th:replace="~{fragments :: bodyItem(${item})}"></th:block>
        </th:block>
        <th:block th:if="${body.paywalled()}">
          <div class="paywall__locked-content">
            <th:block th:each="item : ${body.locked()}">
              <th:block th:replace="~{fragments :: bodyItem(${item})}"></th:block>
            </th:block>
          </div>
          <div class="paywall__offer">
            <th:block th:replace="~{fragments :: plusBadge}"></th:block>
            <strong class="paywall__title" th:text="#{paywall.title}"></strong>
            <span class="paywall__text" th:text="#{paywall.text}"></span>
            <button type="button" class="button" data-paywall-unlock th:text="#{paywall.unlock}"></button>
            <span class="paywall__test-note" th:text="#{paywall.testNote}"></span>
          </div>
        </th:block>
        <div data-rainmaker-article-end aria-hidden="true"></div>
      </div>
      <div data-rainmaker-next-step="after-article"></div>
    </article>

    <aside class="article-sidebar">
      <section class="sidebar-box" aria-labelledby="related-heading">
        <h2 id="related-heading" class="block-heading" th:text="#{article.related}"></h2>
        <ol class="latest__list">
          <th:block th:each="story : ${related}">
            <th:block th:replace="~{fragments :: compactCard(${story})}"></th:block>
          </th:block>
        </ol>
        <a class="related__more" th:href="@{/sektion/{id}(id=${article.section().id()})}"
           th:text="#{article.moreInSection(${sectionName})} + ' →'"></a>
      </section>
      <th:block th:replace="~{fragments :: adSlot(${skyscraperAd})}"></th:block>
      <div data-rainmaker-next-step="sidebar"></div>
    </aside>
  </div>
</th:block>
</body>
</html>
