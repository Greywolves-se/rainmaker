# Builds and tests Rainmaker's Java code (services/ and the apps G1-G3) on pull requests and on
# pushes to develop and main (#156).
# - It runs on every pull request, so its check can be required before merging: a required check
#   that never runs would block a PR that changes only e.g. Mission Control or docs/.
#   Pushes run it only when the files below change.
# - The "changes" job decides whether the Java job has to run; a job skipped this way counts as
#   passing. Mission Control's own jobs are in mission-control-ci.yml.
# - The Java job also runs when the root Maven build (pom.xml, mvnw, .mvn/) changes, because those
#   files decide how the modules are built and checked, and when the local database setup
#   (docker/postgres/) changes, because the apps' tests start PostgreSQL with it.
# - The apps' tests start PostgreSQL through Testcontainers; GitHub's Ubuntu runners have Docker.
# - Job names start with "Rainmaker", because mission-control-ci.yml already has a job named
#   "Detect changes", and branch rules require checks by name.

name: Rainmaker CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
    paths:
      - "services/**"
      - "apps/g*-app/**"
      - "docker/postgres/**"
      - ".github/workflows/rainmaker-ci.yml"
      - "pom.xml"
      - "mvnw"
      - ".mvn/**"

permissions:
  contents: read

concurrency:
  group: rainmaker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Rainmaker detect changes
    runs-on: ubuntu-latest
    outputs:
      java: ${{ steps.diff.outputs.java }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare with the base commit
        id: diff
        env:
          # Pull request: compare with the target branch. Push: compare with the previous commit.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A brand-new branch has no previous commit; then run every job.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "java=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          echo "Changed files:"
          echo "$changed"
          if echo "$changed" | grep -qE '^(services/|apps/g[0-9]+-[a-z-]+-app/|docker/postgres/|pom\.xml$|mvnw$|\.mvn/|\.github/workflows/rainmaker-ci\.yml$)'; then
            echo "java=true" >> "$GITHUB_OUTPUT"
          else
            echo "java=false" >> "$GITHUB_OUTPUT"
          fi

  java:
    name: Rainmaker (format, Checkstyle, tests)
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # verify runs Spotless (format), Checkstyle, the tests (ModuleBoundaryTest and the database
      # tests against PostgreSQL in Testcontainers) and JaCoCo, for the apps G1-G3 and every
      # service module they assemble (-am).
      - name: Build and test
        run: >-
          ./mvnw -B -ntp
          -pl apps/g1-reader-app,apps/g2-content-app,apps/g3-publisher-app -am
          verify
