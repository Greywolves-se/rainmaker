# Builds and tests Mission Control on pull requests and on pushes to develop and main.
# - It runs on every pull request, so its checks can be required before merging (#109): a
#   required check that never runs would block a PR that changes only e.g. infra/ or docs/.
#   Pushes run it only when apps/mission-control/** (or the files below) change.
# - The "changes" job decides which of the jobs below have to run, so a PR that only
#   touches the web app runs only the web job. A job skipped this way counts as passing.
# - The collector job builds every Java module of Mission Control (anonymizer, collector,
#   navigator-api, person-names).
#   It also runs when the root Maven build (pom.xml, mvnw, .mvn/) changes,
#   because those files decide how the collector is built and checked.
# - The infra job (#125) builds and tests the CDK app in infra/ when infra/ or the root Maven
#   build changes. It has no AWS access: `cdk diff` stays a manual step.

name: Mission Control CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
    paths:
      - "apps/mission-control/**"
      - "infra/**"
      - ".github/workflows/mission-control-ci.yml"
      - "pom.xml"
      - "mvnw"
      - ".mvn/**"

permissions:
  contents: read

concurrency:
  group: mission-control-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.diff.outputs.web }}
      collector: ${{ steps.diff.outputs.collector }}
      infra: ${{ steps.diff.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare with the base commit
        id: diff
        env:
          # Pull request: compare with the target branch. Push: compare with the previous commit.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A brand-new branch has no previous commit; then run every job.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            {
              echo "web=true"
              echo "collector=true"
              echo "infra=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          echo "Changed files:"
          echo "$changed"
          if echo "$changed" | grep -qE '^(apps/mission-control/(web|contract)/|\.github/workflows/mission-control-ci\.yml$)'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -qE '^(apps/mission-control/(anonymizer|collector|navigator-api|person-names|contract|data)/|apps/mission-control/pom\.xml$|pom\.xml$|mvnw$|\.mvn/|\.github/workflows/mission-control-ci\.yml$)'; then
            echo "collector=true" >> "$GITHUB_OUTPUT"
          else
            echo "collector=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -qE '^(infra/|pom\.xml$|mvnw$|\.mvn/|\.github/workflows/mission-control-ci\.yml$)'; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
          else
            echo "infra=false" >> "$GITHUB_OUTPUT"
          fi

  web:
    name: Web (lint, typecheck, test, build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mission-control/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mission-control/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - run: npm test
      - name: Build
        run: npx vite build

  collector:
    name: Collector (format, Checkstyle, tests)
    needs: changes
    if: needs.changes.outputs.collector == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # verify runs Spotless (format), Checkstyle, the unit tests and JaCoCo (#39).
      - name: Build and test
        run: ./mvnw -B -ntp -f apps/mission-control/pom.xml verify

  infra:
    name: Infra (CDK synth and tests)
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # The CDK Java library runs on Node.js internally (infra/README.md: 22 or newer).
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Spotless, Checkstyle and the CDK assertion tests, which synthesize every stack in memory.
      # No AWS credentials: `cdk diff` stays a manual step (CLAUDE.md, "Infrastructure").
      - name: Build and test
        run: ./mvnw -B -ntp -pl infra -am verify
