# Builds the Mission Control Docker images, pushes them to Amazon ECR and deploys staging.
# - Pull requests: build only (proves the Dockerfiles work), nothing is pushed and no AWS access.
# - Push to develop: build and push to ECR in the staging account (GitHub environment "staging"),
#   then roll the ECS service mission-control-web onto the new image (job "deploy-staging").
#   The staging web image carries a fresh snapshot: the collector runs first and its
#   snapshot.json is copied into the image (#17). It is also kept as a workflow artifact.
# - Three times a day on weekdays (schedule) and manual runs on develop do the same, so staging gets
#   fresh data.
# - Push to main: build and push to ECR in the production account (GitHub environment "production",
#   which requires a reviewer to approve the run before it starts). Production is not deployed
#   automatically.
# An image is skipped (with a notice) until its source exists: collector #7, web #8.
#
# AWS access uses GitHub OIDC, so no AWS keys are stored in GitHub. Each environment has the
# variables AWS_ROLE_ARN (the github-actions-rainmaker role in that account) and AWS_REGION.
# The role may push to the ECR repositories rainmaker-mission-control-collector and
# rainmaker-mission-control-web in its own account. In the staging account it may also run
# ecs:UpdateService and ecs:DescribeServices on the service default/mission-control-web.

name: Docker

on:
  push:
    branches: [develop, main]
    paths:
      - "apps/mission-control/**"
      - "pom.xml"
      - "mvnw"
      - ".mvn/**"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "apps/mission-control/**"
      - "pom.xml"
      - "mvnw"
      - ".mvn/**"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  # Three times on weekdays, 04:23, 08:23 and 12:23 UTC (06:23, 10:23, 14:23 Stockholm summer
  # time; 05:23, 09:23, 13:23 winter time): rebuild staging with a fresh snapshot (#17, #101).
  # Kept low to save Actions minutes on the free plan (team decision, 16 Oct 2026). Scheduled
  # runs use the default branch, develop. Minute 23, not the full hour: GitHub delays or drops
  # scheduled runs at busy times such as the start of an hour (the 05:00 run was skipped and
  # others started 1–4 hours late, #101).
  schedule:
    - cron: "23 4,8,12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time. On develop and main a new run waits instead of cancelling the
# running one, so a scheduled run never stops a deploy halfway (#101). Pull requests only build,
# so a newer push may cancel the older run.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compose:
    name: Validate docker-compose.yml
    # Scheduled runs only refresh the snapshot; nothing to validate (saves Actions minutes).
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f apps/mission-control/docker-compose.yml config --quiet

  image:
    name: Image (${{ matrix.image }})
    runs-on: ubuntu-latest
    # develop -> staging, main -> production. Pull requests and other branches run without an
    # environment, so they cannot assume either AWS role.
    environment: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' && 'staging' || github.ref == 'refs/heads/main' && 'production') || '' }}
    permissions:
      contents: read
      id-token: write # lets the job request a GitHub OIDC token to assume the AWS role
      issues: read # the collector's GitHub source reads issues and milestones (#12, #17)
      pull-requests: read # the pull request source reads pull requests and reviews (#13)
      checks: read # ...and the check runs of each pull request's head commit (#13)
      actions: read # the builds source reads the latest workflow runs (#14)
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: collector
            dockerfile: apps/mission-control/collector/Dockerfile
            source: apps/mission-control/collector/pom.xml
          - image: web
            dockerfile: apps/mission-control/web/Dockerfile
            source: apps/mission-control/web/package.json
    env:
      # Only develop and main publish images; pull requests and other branches only build.
      PUSH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') }}
      # Only the staging web image carries the collector's snapshot (#17). Production and pull
      # request images never do.
      BAKE_SNAPSHOT: ${{ matrix.image == 'web' && github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' }}
      REPOSITORY: rainmaker-mission-control-${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Check that the source exists
        id: source
        run: |
          # Scheduled runs only refresh the snapshot, which lives in the web image (#101).
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ matrix.image }}" != "web" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=${{ matrix.image }} image skipped::Scheduled runs rebuild only the web image."
          elif [ -f "${{ matrix.source }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=${{ matrix.image }} image skipped::${{ matrix.source }} does not exist yet, so there is nothing to build."
          fi

      - uses: actions/setup-java@v4
        if: env.BAKE_SNAPSHOT == 'true'
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Built before the job has any AWS credentials, so Maven and its plugins never hold them.
      - name: Build the collector
        if: env.BAKE_SNAPSHOT == 'true'
        run: ./mvnw -B -ntp -q -f apps/mission-control/pom.xml -pl collector -am package -DskipTests

      # After the build: "Collect the snapshot" reads the OpenAI key from Secrets Manager (#112).
      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.source.outputs.present == 'true' && env.PUSH == 'true'
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Google Drive (#112, #113): GitHub Actions signs in to Google with Workload Identity
      # Federation, so no Google key exists anywhere. The action writes short-lived credentials to
      # a gha-creds-*.json file (git- and docker-ignored) and sets GOOGLE_APPLICATION_CREDENTIALS,
      # which the collector uses (Application Default Credentials). Skipped until the staging
      # environment has both variables; the Drive source then fails or stays disabled, as configured.
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        if: env.BAKE_SNAPSHOT == 'true' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != ''
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # Writes apps/mission-control/out/projects.json and out/<project>/ (#99), which the web app
      # reads (#100). If the run fails, the job fails and staging keeps the image it already runs
      # instead of getting one without data.
      - name: Collect the snapshot
        if: env.BAKE_SNAPSHOT == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The OpenAI key (#112) reaches the collector process only: it is not exported, and the
          # AWS credentials are removed before the collector starts.
          # read_secret prints the value. A secret that does not exist yet gives a notice; any
          # other error gives a warning with the AWS error code (never the value). Either way the
          # collector runs without it, and that source reports an error in the snapshot.
          read_secret() {
            local name="$1" error code
            error=$(mktemp)
            if aws secretsmanager get-secret-value --secret-id "$name" \
                --query SecretString --output text 2>"$error"; then
              rm -f "$error"
              return 0
            fi
            code=$(grep -oE '\([A-Za-z]+\)' "$error" | head -n 1 | tr -d '()' || true)
            rm -f "$error"
            if [ "$code" = "ResourceNotFoundException" ]; then
              echo "::notice title=Secret not set up yet::$name does not exist; the collector runs without it." >&2
            else
              echo "::warning title=Secret could not be read::$name: ${code:-unknown error}. Check the role policy and the secret's KMS key." >&2
            fi
            return 0
          }
          openai=$(read_secret mission-control/openai-api-key)
          # Mask it before anything can print it.
          if [ -n "$openai" ]; then echo "::add-mask::$openai"; fi
          if [ -z "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]; then
            echo "::notice title=Google Drive not set up yet::No Workload Identity Federation variables in the staging environment; the collector runs without Drive."
          fi

          # The collector needs no AWS access. Only a key that exists is passed to it; Google
          # signs in through GOOGLE_APPLICATION_CREDENTIALS from the step above.
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
          secrets=()
          if [ -n "$openai" ]; then secrets+=("OPENAI_API_KEY=$openai"); fi
          env "${secrets[@]}" java -jar apps/mission-control/collector/target/collector-*.jar
          # Every project in projects.json needs its snapshot, or staging shows an error for it.
          out=apps/mission-control/out
          test -s "$out/projects.json"
          ids=$(jq -er '.projects[].id' "$out/projects.json")  # fails the step on invalid JSON
          for id in $ids; do
            test -s "$out/$id/snapshot.json" || { echo "::error::$id is in projects.json but has no snapshot.json"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        if: env.BAKE_SNAPSHOT == 'true'
        with:
          name: snapshot
          path: apps/mission-control/out/
          retention-days: 14

      - uses: docker/setup-buildx-action@v3
        if: steps.source.outputs.present == 'true'

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
        if: steps.source.outputs.present == 'true' && env.PUSH == 'true'

      - id: meta
        uses: docker/metadata-action@v5
        if: steps.source.outputs.present == 'true'
        with:
          # Builds that do not push have no registry; "local" keeps the image name valid.
          images: ${{ steps.ecr.outputs.registry || 'local' }}/${{ env.REPOSITORY }}
          # Every branch build -> :<branch>, every build -> :sha-<short sha>,
          # and the default branch (develop) also -> :latest.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        if: steps.source.outputs.present == 'true'
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The staging web image gets the snapshot through its own build context (see
          # web/Dockerfile); .dockerignore keeps out/ out of the main context.
          build-contexts: ${{ env.BAKE_SNAPSHOT == 'true' && 'snapshot=apps/mission-control/out' || '' }}
          # Images with a snapshot use their own cache, so no other build can reuse a layer
          # that contains one.
          cache-from: type=gha,scope=${{ matrix.image }}${{ env.BAKE_SNAPSHOT == 'true' && '-staging' || '' }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}${{ env.BAKE_SNAPSHOT == 'true' && '-staging' || '' }}

  deploy-staging:
    name: Deploy web to staging
    # Runs only after every image in the matrix has been built and pushed.
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write # lets the job request a GitHub OIDC token to assume the AWS role
    env:
      ECS_CLUSTER: default
      ECS_SERVICE: mission-control-web
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # The service runs a mutable tag (:develop / :latest). A forced deployment makes ECS
      # resolve the tag again and roll out the image that was just pushed, using the service's
      # own canary rollout and circuit breaker.
      - name: Roll out the new image
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --query 'service.deployments[0].{id:id,rollout:rolloutState}' \
            --output table
          echo "::notice title=Staging deploy started::$ECS_SERVICE is rolling out ${GITHUB_SHA::7}. ECS takes about 8–10 minutes (canary + bake time)."
